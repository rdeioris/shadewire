[workspace]
resolver = "3"
members = ["crates/shadewire", "crates/shadewire-wgsl", "crates/shadewire-glsl", "crates/shadewire-gdshader", "crates/shadewire-hlsl", "crates/shadewire-msl", "crates/shadewire-nodes", "crates/shadewire-mtlx", "crates/shadewire-blender", "crates/shadewire-cli", "crates/shadewire-capi", "crates/shadewire-capi-ctest", "crates/shadewire-bevy", "crates/shadewire-py"]
# Its own workspace: gdext needs a newer Rust (see its Cargo.toml).
exclude = ["crates/shadewire-godot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Roberto De Ioris"]
repository = "https://github.com/rdeioris/shadewire"
homepage = "https://github.com/rdeioris/shadewire"

[workspace.dependencies]
shadewire = { path = "crates/shadewire", version = "0.1.0" }
shadewire-nodes = { path = "crates/shadewire-nodes", version = "0.1.0" }
shadewire-mtlx = { path = "crates/shadewire-mtlx", version = "0.1.0" }
shadewire-blender = { path = "crates/shadewire-blender", version = "0.1.0" }
shadewire-capi = { path = "crates/shadewire-capi", version = "0.1.0" }
shadewire-wgsl = { path = "crates/shadewire-wgsl", version = "0.1.0", default-features = false }
shadewire-glsl = { path = "crates/shadewire-glsl", version = "0.1.0" }
shadewire-gdshader = { path = "crates/shadewire-gdshader", version = "0.1.0" }
shadewire-hlsl = { path = "crates/shadewire-hlsl", version = "0.1.0" }
shadewire-msl = { path = "crates/shadewire-msl", version = "0.1.0" }
naga = { version = "30", features = ["wgsl-in", "wgsl-out", "hlsl-out", "glsl-out", "msl-out", "spv-out"] }
quick-xml = "0.38"
typed-arena = "2"
include_dir = "0.7"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
wgpu = "30"
pollster = "0.4"
insta = "1"
png = "0.17"
cbindgen = "0.29"
cc = "1"
# The library's minimum; the example's window, glTF and tonemapping features are shadewire-bevy dev-dependencies.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "png",
    "jpeg",
] }
