[workspace]
resolver = "3"
members = ["crates/shadewire", "crates/shadewire-wgsl", "crates/shadewire-mtlx", "crates/shadewire-cli", "crates/shadewire-capi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Roberto De Ioris"]
repository = "https://github.com/rdeioris/shadewire"

[workspace.dependencies]
shadewire = { path = "crates/shadewire" }
shadewire-mtlx = { path = "crates/shadewire-mtlx" }
shadewire-capi = { path = "crates/shadewire-capi" }
shadewire-wgsl = { path = "crates/shadewire-wgsl", default-features = false }
naga = { version = "30", features = ["wgsl-in", "wgsl-out", "hlsl-out", "glsl-out", "msl-out", "spv-out"] }
quick-xml = "0.38"
include_dir = "0.7"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
wgpu = "30"
pollster = "0.4"
insta = "1"
png = "0.17"
cbindgen = "0.29"
cc = "1"
