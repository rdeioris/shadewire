[package]
name = "shadewire-unreal"
description = "Unreal Engine material graph reader for Shadewire: the shadewire-unreal-graph JSON to the IR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
keywords = ["unreal", "materialx", "shader", "material", "pbr"]
categories = ["graphics", "rendering", "parser-implementations"]

[dependencies]
shadewire.workspace = true
shadewire-nodes.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
shadewire = { workspace = true, features = ["test-support"] }
shadewire-mtlx.workspace = true
shadewire-mdl.workspace = true
shadewire-wgsl = { workspace = true, features = ["validate"] }
insta.workspace = true
