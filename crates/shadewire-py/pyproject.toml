[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "shadewire"
description = "Shadewire: compile MaterialX materials to an IR (a typed DAG and closure tree) and to WGSL, HLSL, GLSL, MSL, SPIR-V"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Roberto De Ioris" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/rdeioris/shadewire"

[tool.maturin]
# A Python package (`python/shadewire`: the re-exports and the type stubs) around the native `shadewire._native`.
python-source = "python"
module-name = "shadewire._native"
features = ["pyo3/extension-module"]
