[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "shadewire"
description = "Compile MaterialX materials with Shadewire: the IR (a typed DAG and closure tree) as Python objects"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Roberto De Ioris" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/rdeioris/shadewire"

[tool.maturin]
module-name = "shadewire"
features = ["pyo3/extension-module"]
