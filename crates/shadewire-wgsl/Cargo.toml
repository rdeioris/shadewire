[package]
name = "shadewire-wgsl"
description = "WGSL emitter for Shadewire material DAGs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["translate"]
# `link` and `translate` (validation and HLSL/GLSL/MSL/SPIR-V output) through naga.
translate = ["dep:naga"]

[dependencies]
shadewire-ir.workspace = true
naga = { workspace = true, optional = true }

[dev-dependencies]
naga.workspace = true
wgpu.workspace = true
pollster.workspace = true
