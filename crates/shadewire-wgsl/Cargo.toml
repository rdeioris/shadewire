[package]
name = "shadewire-wgsl"
description = "Shadewire WGSL back end: material IR to WGSL and reflection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
keywords = ["materialx", "shader", "wgsl", "webgpu", "wgpu"]
categories = ["graphics", "rendering"]

[features]
# `validate`: checking generated WGSL with naga, for tests.
validate = ["dep:naga"]

[dependencies]
shadewire.workspace = true
naga = { workspace = true, optional = true }

[dev-dependencies]
naga.workspace = true
wgpu.workspace = true
pollster.workspace = true
