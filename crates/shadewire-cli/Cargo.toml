[package]
name = "shadewire-cli"
description = "Command line front end for Shadewire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
shadewire.workspace = true
shadewire-mtlx.workspace = true
shadewire-wgsl = { workspace = true, features = ["translate"] }
clap.workspace = true
serde_json.workspace = true

[[bin]]
name = "shadewire"
path = "src/main.rs"
# The library crate is also named `shadewire`; documenting both would collide.
doc = false

[dev-dependencies]
serde_json.workspace = true
