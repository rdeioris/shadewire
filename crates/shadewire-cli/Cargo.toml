[package]
name = "shadewire-cli"
description = "Command line front end for Shadewire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
keywords = ["materialx", "shader", "wgsl", "glsl", "hlsl"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
shadewire.workspace = true
shadewire-mtlx.workspace = true
shadewire-blender.workspace = true
shadewire-nodes.workspace = true
shadewire-wgsl.workspace = true
shadewire-glsl.workspace = true
shadewire-hlsl.workspace = true
shadewire-msl.workspace = true
shadewire-gdshader.workspace = true
clap.workspace = true
serde_json.workspace = true

[[bin]]
name = "shadewire"
path = "src/main.rs"
# The library crate is also named `shadewire`; documenting both would collide.
doc = false

[dev-dependencies]
serde_json.workspace = true
