[package]
name = "shadewire-bevy"
description = "Shadewire materials in Bevy: MaterialX graphs as StandardMaterial extensions"
version.workspace = true
edition.workspace = true
rust-version = "1.97.1"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
shadewire.workspace = true
shadewire-mtlx.workspace = true
shadewire-wgsl.workspace = true
bevy.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The versions Bevy 0.20 compiles shaders with (bevy_shader: wesl 0.6 with naga-ext; wgpu 30: naga 30).
wesl = { version = "0.6", features = ["naga-ext"] }
naga.workspace = true
