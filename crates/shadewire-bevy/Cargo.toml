[package]
name = "shadewire-bevy"
description = "Shadewire materials in Bevy: MaterialX graphs as StandardMaterial extensions"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
keywords = ["materialx", "bevy", "shader", "material", "pbr"]
categories = ["game-development", "rendering"]

[dependencies]
shadewire.workspace = true
shadewire-mtlx.workspace = true
shadewire-nodes.workspace = true
shadewire-wgsl.workspace = true
bevy.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The example's window, glTF scenes and tonemapping; the library needs none of them. It spawns glTF scenes
# through reflection: without auto-registration Transform is unregistered and spawning panics.
bevy = { workspace = true, features = [
    "async_executor",
    "multi_threaded",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "x11",
    "bevy_gltf",
    "bevy_mikktspace",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
    "reflect_auto_register",
] }
# The versions Bevy 0.20 compiles shaders with (bevy_shader: wesl 0.6 with naga-ext; wgpu 30: naga 30).
wesl = { version = "0.6", features = ["naga-ext"] }
naga.workspace = true
png.workspace = true
