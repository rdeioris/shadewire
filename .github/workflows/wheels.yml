# The `shadewire` Python module: one stable-ABI (abi3, Python >= 3.8) wheel per platform Blender ships for,
# each built and imported on its own OS, under the oldest and the newest Python.
name: wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # Windows on ARM has official CPython builds from 3.11 only.
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, oldest: "3.11" }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2014" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2014" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/shadewire-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out ${{ github.workspace }}/wheels
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.oldest || '3.8' }}
      - name: import under the oldest Python
        shell: bash
        run: python -m pip install --no-index --find-links wheels shadewire && python -c "import shadewire; ir = shadewire.mtlx.to_ir('<materialx version=\"1.39\"><oren_nayar_diffuse_bsdf name=\"d\" type=\"BSDF\"/><surface name=\"s\" type=\"surfaceshader\"><input name=\"bsdf\" type=\"BSDF\" nodename=\"d\"/></surface><surfacematerial name=\"m\" type=\"material\"><input name=\"surfaceshader\" type=\"surfaceshader\" nodename=\"s\"/></surfacematerial></materialx>', models=['surface']); d = ir.optimize().to_dict(); assert d['closure']['nodes'][0]['kind'] == 'oren_nayar_diffuse_bsdf'; out = shadewire.wgsl.compile(ir); assert 'fn shadewire_eval_surface' in out.code; assert 'shadewire_eval_surface() {' in shadewire.glsl.compile(ir).code; print(shadewire.version(), 'ok')"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: import under Python 3.14
        shell: bash
        run: python -m pip install --no-index --find-links wheels shadewire && python -c "import shadewire; ir = shadewire.mtlx.to_ir('<materialx version=\"1.39\"><oren_nayar_diffuse_bsdf name=\"d\" type=\"BSDF\"/><surface name=\"s\" type=\"surfaceshader\"><input name=\"bsdf\" type=\"BSDF\" nodename=\"d\"/></surface><surfacematerial name=\"m\" type=\"material\"><input name=\"surfaceshader\" type=\"surfaceshader\" nodename=\"s\"/></surfacematerial></materialx>', models=['surface']); d = ir.optimize().to_dict(); assert d['closure']['nodes'][0]['kind'] == 'oren_nayar_diffuse_bsdf'; out = shadewire.wgsl.compile(ir); assert 'fn shadewire_eval_surface' in out.code; assert 'shadewire_eval_surface() {' in shadewire.glsl.compile(ir).code; print(shadewire.version(), 'ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: wheels/*.whl
